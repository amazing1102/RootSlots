version: 2
updates:
  # Gradle 依赖(app/build.gradle.kts 等)
  - package-ecosystem: gradle
    directory: "/RootSlots"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]

  # GitHub Actions 版本维护
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
