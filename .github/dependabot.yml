version: 2
updates:
  # Gradle 依赖(app/build.gradle.kts 等)
  - package-ecosystem: gradle
    directory: "/RootSlots"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    # 小版本/补丁合并成一个 PR,减少噪音
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # —— 以下升级互相强绑定,必须人工成套对齐后升级,禁止自动提 PR ——
      # Kotlin ↔ KSP ↔ Compose 编译器插件 ↔ AGP:版本矩阵必须整套匹配
      # (KSP 2.0.21-1.0.25 只配 Kotlin 2.0.21;AGP 8.5.2 只配 Gradle 8.7)
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Room:升版涉及 KSP 对齐与迁移回归测试(本项目有 v7→v8 真迁移史)
      - dependency-name: "androidx.room:*"
      # androidx.core:新版常要求更高 compileSdk,人工升级
      - dependency-name: "androidx.core:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions 版本维护
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch", "major"]
